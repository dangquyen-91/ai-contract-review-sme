openapi: 3.0.0
info:
  title: AI Contract Review Assistant API
  version: 0.1.0
  description: REST API for the FPT Capstone AI Contract Review Assistant
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Organizations
  - name: Contracts
  - name: ContractProfiles
  - name: Reviews
  - name: LegalKB

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        details:
          type: object

    Organization:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        taxCode:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        taxCode:
          type: string
          maxLength: 50
        address:
          type: string
          maxLength: 500

    UpdateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 200
        taxCode:
          type: string
          nullable: true
          maxLength: 50
        address:
          type: string
          nullable: true
          maxLength: 500

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    AuthUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [administrator, manager, staff, owner, reviewer, user]
        orgId:
          type: string
          nullable: true
        hasCompletedOnboarding:
          type: boolean

    Contract:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
          description: Contract profile code (see GET /contract-profiles), e.g. sales, service, office_lease, labor, housing_purchase, life_insurance
        ourParty:
          type: string
          description: Party code the user represents in this contract (one of the profile's parties); absent if not specified
        industry:
          type: string
          description: Industry code of the user's business (see GET /contract-profiles); absent if not specified
        status:
          type: string
        currentVersion:
          $ref: '#/components/schemas/ContractVersion'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ContractVersion:
      type: object
      description: All per-upload state for a contract (currently only version 1 is ever created - no re-upload/version-compare UI yet).
      properties:
        id:
          type: string
        contractId:
          type: string
        versionNumber:
          type: integer
        fileName:
          type: string
          description: Original file name. The file itself is stored privately - get a short-lived download link from GET /contracts/{id}/file
        mimeType:
          type: string
        extractionStatus:
          type: string
          enum: [pending, processing, completed, failed, unsupported]
          description: Status of text extraction (OCR/parsing) from the uploaded file. Extraction runs in a background worker; "processing" means the job is queued or running.
        extractionError:
          type: string
          description: Error message when extractionStatus is "failed"
        extractionStartedAt:
          type: string
          format: date-time
        extractionProgress:
          type: object
          description: Present only while extraction is running
          properties:
            processedPages:
              type: integer
            totalPages:
              type: integer
        redactionSummary:
          type: object
          description: Personal data found in the extracted text under the contract profile's redactionPolicy; these values are replaced by placeholders before any AI call
          properties:
            total:
              type: integer
            counts:
              type: object
              additionalProperties:
                type: integer
              example: { person_name: 2, national_id: 1, phone: 2, bank_account: 1 }
        extractionQuality:
          type: object
          description: How the text was extracted and how reliable it is. PDFs are read page by page - pages with a text layer use it, scanned pages are OCRed (Vietnamese + English).
          properties:
            method:
              type: string
              enum: [text_layer, ocr, mixed, docx]
              description: mixed = some PDF pages had a text layer and the rest were OCRed
            pageCount:
              type: integer
              description: Total pages in the file (absent for DOCX)
            ocrPageCount:
              type: integer
            ocrConfidence:
              type: integer
              minimum: 0
              maximum: 100
              description: Average Tesseract confidence over OCRed pages, weighted by text length; absent when nothing was OCRed
            lowConfidence:
              type: boolean
              description: True when OCR confidence is below 70 - the scan is likely blurry and the analysis may contain reading errors
            truncatedAtPage:
              type: integer
              description: Set when the PDF has more than 100 pages; only the first 100 pages were extracted
        segmentationStatus:
          type: string
          enum: [pending, processing, completed, failed]
          description: Status of clause segmentation/classification (see /contracts/{id}/clauses)
        segmentationError:
          type: string
          description: Error message when segmentationStatus is "failed"
        segmentationStartedAt:
          type: string
          format: date-time
          description: When the last segmentation run started; a "processing" run older than 10 minutes is treated as crashed and can be re-run
        riskDetectionStatus:
          type: string
          enum: [pending, processing, completed, failed]
          description: Status of risk detection (see /contracts/{id}/risks)
        riskDetectionError:
          type: string
          description: Error message when riskDetectionStatus is "failed"
        riskDetectionStartedAt:
          type: string
          format: date-time
          description: When the last risk detection run started (same 10-minute stale rule as segmentation)
        overallAssessment:
          type: array
          items:
            type: string
          description: '"Đánh giá tổng quan" bullets (Vietnamese), written together with the findings by /risks/detect'
        overallRiskLevel:
          type: string
          enum: [high, medium, low, none]
        analysisFocus:
          type: string
          description: Free-text analysis direction the user last requested (e.g. "phân tích theo hướng có lợi cho bên A"), sent to /risks/detect or /summary. Reused by later calls and by chat when not re-sent.
        summaryPoints:
          type: array
          items:
            type: string
          description: '"Tóm tắt nội dung" bullets - plain-language Vietnamese overview of the whole contract, generated by the LLM (see /contracts/{id}/summary)'
        summaryStatus:
          type: string
          enum: [pending, processing, completed, failed]
          description: Status of whole-contract summarization
        summaryError:
          type: string
          description: Error message when summaryStatus is "failed"
        summaryStartedAt:
          type: string
          format: date-time
          description: When the last summary run started (same 10-minute stale rule as segmentation)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Review:
      type: object
      description: One review run of a contract (clause segmentation, then summary and risk detection in parallel), executed by a background worker. Results are written to the contract like the step-by-step endpoints do, and a snapshot is kept on the review so earlier runs stay visible.
      properties:
        _id:
          type: string
        contractId:
          type: string
        versionId:
          type: string
        requestedBy:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        currentStage:
          type: string
          enum: [waiting_for_extraction, segmentation, summary, risk_detection]
          description: Present while running. waiting_for_extraction means the upload is still being OCRed.
        stageDetail:
          type: string
          description: Extra progress text, e.g. "7/12 pages" while waiting for extraction, or retrieving_legal_sources / analyzing_clauses / saving_findings during risk detection
        stages:
          type: object
          description: A retry re-runs only the stages that are not completed
          properties:
            segmentation:
              type: string
              enum: [pending, running, completed, failed]
            summary:
              type: string
              enum: [pending, running, completed, failed]
            riskDetection:
              type: string
              enum: [pending, running, completed, failed]
        analysisFocus:
          type: string
        error:
          type: string
          description: Last error; set while a retry is pending or when the review failed
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        result:
          type: object
          description: Snapshot of the outcome, present when status is completed
          properties:
            overallRiskLevel:
              type: string
              enum: [high, medium, low, none]
            overallAssessment:
              type: array
              items:
                type: string
            summaryPoints:
              type: array
              items:
                type: string
            clauseCount:
              type: integer
            findingCounts:
              type: object
              properties:
                high:
                  type: integer
                medium:
                  type: integer
                low:
                  type: integer
            findings:
              type: array
              items:
                type: object
                properties:
                  findingType:
                    type: string
                    enum: [clause_risk, missing_clause]
                  severity:
                    type: string
                    enum: [high, medium, low]
                  title:
                    type: string
                  clauseIndex:
                    type: integer
                  clauseTitle:
                    type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ClauseTypeTaxonomy:
      type: object
      description: A clause category in the shared taxonomy, seeded on server boot. Which categories a contract is classified into, and which are mandatory, is decided by its contract profile.
      properties:
        id:
          type: string
        code:
          type: string
          enum:
            [
              subject_scope,
              payment,
              deposit,
              term,
              delivery_handover,
              service_level,
              warranty,
              property_legal_status,
              ownership_transfer,
              maintenance_repair,
              sublease_transfer,
              probation,
              wages,
              working_time,
              social_insurance,
              insurance_benefits,
              insurance_exclusions,
              claims,
              surrender_value,
              confidentiality,
              data_protection,
              intellectual_property,
              penalty,
              indemnity,
              liability,
              renewal,
              termination,
              force_majeure,
              dispute_resolution,
              other,
            ]
        name:
          type: string
        description:
          type: string

    ContractProfile:
      type: object
      description: A contract type with its Vietnamese legal context. Decides how contracts of this type are classified and which clauses are mandatory.
      properties:
        code:
          type: string
          example: office_lease
        aliases:
          type: array
          items:
            type: string
          description: Older codes still accepted as this profile (e.g. saas for service)
        name:
          type: string
          example: Thuê văn phòng, mặt bằng
        segment:
          type: string
          enum: [business, individual, both]
        parties:
          type: array
          description: Valid values for Contract.ourParty
          items:
            type: object
            properties:
              code:
                type: string
                example: lessee
              name:
                type: string
                example: Bên thuê
        governingLaws:
          type: array
          items:
            type: string
          example: [Bộ luật Dân sự 2015, Luật Kinh doanh bất động sản 2023]
        redactionPolicy:
          type: array
          description: Kinds of personal data replaced by placeholders before any contract text is sent to the AI provider
          items:
            $ref: '#/components/schemas/SensitiveDataType'
        mandatoryClauses:
          type: array
          description: Clause categories flagged as a "missing_clause" finding when absent
          items:
            $ref: '#/components/schemas/ClauseCategoryRef'
        industries:
          type: array
          description: Every industry, with the extra checks and mandatory clauses this profile adds for it (empty when the profile has no rule for that industry)
          items:
            type: object
            properties:
              code:
                type: string
                example: fnb
              name:
                type: string
                example: Ăn uống (F&B)
              checks:
                type: array
                items:
                  type: string
              extraMandatoryClauses:
                type: array
                items:
                  $ref: '#/components/schemas/ClauseCategoryRef'

    SensitiveDataType:
      type: string
      enum:
        [
          person_name,
          national_id,
          passport,
          date_of_birth,
          phone,
          email,
          bank_account,
          personal_address,
          tax_code,
          land_certificate,
        ]

    ClauseCategoryRef:
      type: object
      properties:
        code:
          type: string
        name:
          type: string

    Clause:
      type: object
      required: [index, text, startOffset, endOffset]
      properties:
        id:
          type: string
        contractVersionId:
          type: string
        index:
          type: integer
          description: Order of the clause within the contract
        title:
          type: string
          description: 'Clause heading, if present in the contract (e.g. "Dieu 3: Thanh toan")'
        text:
          type: string
          description: Verbatim clause text extracted from the contract
        startOffset:
          type: integer
          description: Start position (inclusive) of this clause in the extracted text returned by GET /contracts/{id}/text. Clause text is always the exact slice text[startOffset, endOffset).
        endOffset:
          type: integer
          description: End position (exclusive) of this clause in the extracted text
        clauseTypeId:
          $ref: '#/components/schemas/ClauseTypeTaxonomy'
          description: Populated taxonomy entry for this clause's category
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ChatMessage:
      type: object
      properties:
        id:
          type: string
        contractVersionId:
          type: string
        userId:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    RiskFinding:
      type: object
      properties:
        id:
          type: string
        contractVersionId:
          type: string
        clauseId:
          type: string
          nullable: true
          description: Set when findingType is "clause_risk"; null for "missing_clause"
        clause:
          type: object
          nullable: true
          description: Position info of the clause this finding refers to (for highlighting in the document view); null for "missing_clause"
          properties:
            index:
              type: integer
            title:
              type: string
            startOffset:
              type: integer
              description: Offset into the text from GET /contracts/{id}/text
            endOffset:
              type: integer
        expectedClauseTypeId:
          $ref: '#/components/schemas/ClauseTypeTaxonomy'
          description: Set when findingType is "missing_clause"; the populated taxonomy entry expected but absent
        findingType:
          type: string
          enum: [clause_risk, missing_clause]
        severity:
          type: string
          enum: [high, medium, low]
        title:
          type: string
        problem:
          type: array
          items:
            type: string
          description: '"Vấn đề" bullets - what exactly is wrong or ambiguous (Vietnamese)'
        consequences:
          type: array
          items:
            type: string
          description: '"Hệ quả thực tế" bullets'
        legalBasis:
          type: array
          description: '"Cơ sở pháp lý" items. legalKnowledgeChunkIds match RiskCitation.legalKnowledgeChunkId in `citations`, so the UI can render source markers like [A], [B].'
          items:
            type: object
            properties:
              text:
                type: string
              legalKnowledgeChunkIds:
                type: array
                items:
                  type: string
        recommendations:
          type: array
          items:
            type: string
          description: '"Sửa thành" bullets'
        proposedRevision:
          type: object
          nullable: true
          description: Suggested rewrite shown as a diff (originalText struck through, revisedText added)
          properties:
            originalText:
              type: string
              description: Text of the clause being replaced; absent for "missing_clause" (revisedText is then a whole new clause to insert)
            revisedText:
              type: string
            reason:
              type: string
            isEdited:
              type: boolean
        status:
          type: string
          enum: [open, acknowledged, dismissed, resolved]
        detectedBy:
          type: string
          enum: [rule, llm, hybrid]
        citations:
          type: array
          description: Legal sources the LLM actually relied on for this finding (RAG), populated by GET/POST risk endpoints
          items:
            $ref: '#/components/schemas/RiskCitation'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RiskCitation:
      type: object
      properties:
        legalKnowledgeChunkId:
          type: string
        citationLabel:
          type: string
          description: 'e.g. "BLDS 2015"'
        sourceTitle:
          type: string
        articleRef:
          type: string
          description: 'e.g. "Dieu 418, Khoan 2"'
        chunkText:
          type: string
        relevanceScore:
          type: number
          description: Cosine similarity score from the vector search retrieval (0-1)

    CreateContractRequest:
      type: object
      required: [title, type]
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 300
        type:
          type: string
          description: Contract profile code or alias (see GET /contract-profiles). Unknown codes return 400.
          example: sales
        ourParty:
          type: string
          description: Optional. One of the profile's party codes; risks are then judged from this party's point of view
          example: buyer
        industry:
          type: string
          description: Optional. Industry code; adds the profile's industry-specific checks and mandatory clauses
          example: fnb
        file:
          type: string
          format: binary

    LegalSource:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          description: 'e.g. "Bo luat Dan su 2015"'
        sourceType:
          type: string
          enum: [law, standard_template]
        citationLabel:
          type: string
          description: 'Short label used when citing this source, e.g. "BLDS 2015"'
        issuingBody:
          type: string
        effectiveDate:
          type: string
          format: date-time
        chunkCount:
          type: integer
          description: Number of LegalKnowledgeChunk documents produced from this source (list endpoint only)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateLegalSourceRequest:
      type: object
      required: [title, sourceType, citationLabel, file]
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 300
        sourceType:
          type: string
          enum: [law, standard_template]
        citationLabel:
          type: string
          minLength: 1
          maxLength: 100
        issuingBody:
          type: string
          maxLength: 200
        effectiveDate:
          type: string
          format: date
        file:
          type: string
          format: binary
          description: Legal document to chunk and embed (pdf, docx, or txt)

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/onboarding/complete:
    post:
      tags: [Auth]
      summary: Mark onboarding as done (creates a personal workspace for role "user" without an org)
      description: The access token still carries the old orgId afterwards - call /auth/refresh to get one that includes the new workspace.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '401':
          description: Missing/invalid token, or the user is inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /organizations:
    post:
      tags: [Organizations]
      summary: Create an organization for the current user
      description: A user can create an organization only when they do not already belong to one. Refresh the access token after success to include the new orgId claim.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created and attached to the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User already belongs to an organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /organizations/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    get:
      tags: [Organizations]
      summary: Get the current user's organization
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          description: The user does not belong to this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [Organizations]
      summary: Update an organization
      description: Requires the administrator or organization owner role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Organizations]
      summary: Delete an organization
      description: Requires the administrator or organization owner role. Deletion is blocked while contracts or other members remain.
      responses:
        '204':
          description: Organization deleted
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Organization still has contracts or other members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts:
    get:
      tags: [Contracts]
      summary: List contracts for the current org (filter/sort/paginate)
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: sortBy
          schema:
            type: string
            enum: [createdAt, updatedAt, title, type, status, overallRiskLevel]
            default: createdAt
          description: overallRiskLevel sorts by severity (high > medium > low > none), not alphabetically
        - in: query
          name: sortOrder
          schema: { type: string, enum: [asc, desc] }
        - in: query
          name: type
          schema: { type: string }
          description: Contract profile code or alias (see GET /contract-profiles). Unknown codes return 400.
        - in: query
          name: industry
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: riskLevel
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contract'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
    post:
      tags: [Contracts]
      summary: Upload a new contract
      description: |
        The file is stored and text extraction is queued for a background worker (OCR of a large scanned PDF can take minutes).
        - Without a `Prefer` header the request waits for extraction to finish and returns 201, as before.
        - With `Prefer: respond-async` it returns 202 immediately with `currentVersion.extractionStatus = "processing"`; poll GET /contracts/{id} and read `extractionProgress` until the status is completed, failed or unsupported.
      parameters:
        - in: header
          name: Prefer
          required: false
          schema:
            type: string
            enum: [respond-async]
          description: RFC 7240 preference. Send respond-async to get 202 without waiting for extraction.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateContractRequest'
      responses:
        '201':
          description: Created; extraction has finished (completed, failed or unsupported)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '202':
          description: Accepted with Prefer respond-async; extraction is still running in the background
          headers:
            Preference-Applied:
              schema:
                type: string
                example: respond-async
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '400':
          description: Validation error or unsupported file type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: File exceeds the 20MB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The background job queue (Redis) is unavailable; nothing was saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    get:
      tags: [Contracts]
      summary: Get a contract by id
      responses:
        '200':
          description: OK
          content:
            application/json:
