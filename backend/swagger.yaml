  /contracts/{id}/text:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    get:
      tags: [Contracts]
      summary: Get the extracted text of the contract (for the document view next to the analysis)
      description: |
        Clause.startOffset/endOffset and RiskFinding.clause.startOffset/endOffset index into the original text (redacted=false), so the UI can highlight the clause a finding refers to.
        With `redacted=true` the personal data covered by the contract profile's redactionPolicy (names, ID numbers, phones, bank accounts...) is replaced by placeholders such as `[PERSON_1]` or `[PHONE_2]` - the same text the AI receives. Offsets do not apply to the redacted text.
      parameters:
        - in: query
          name: redacted
          required: false
          schema:
            type: string
            enum: ['true', 'false']
            default: 'false'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  text:
                    type: string
                  redacted:
                    type: boolean
                  extractionStatus:
                    type: string
                    enum: [pending, processing, completed, failed, unsupported]
                  fileName:
                    type: string
                  mimeType:
                    type: string
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}/file:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    get:
      tags: [Contracts]
      summary: Get a short-lived download link for the original contract file
      description: Contract files are stored as private Cloudinary assets and cannot be opened without a signed link. Each call returns a new signed link that expires after 5 minutes - request a fresh one each time the file is opened instead of storing it.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    description: Signed Cloudinary download URL
                  expiresAt:
                    type: string
                    format: date-time
                  fileName:
                    type: string
                  mimeType:
                    type: string
        '404':
          description: Contract not found, or the contract has no uploaded file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}/risks/detect/stream:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    post:
      tags: [Contracts]
      summary: Same as /risks/detect, but streamed as Server-Sent Events
      description: |
        Same behavior and body as POST /contracts/{id}/risks/detect, delivered as `text/event-stream`. Use `fetch` (not `EventSource`, which cannot POST or send an Authorization header). Events:
        - `progress` `{ "stage": "retrieving_legal_sources" | "analyzing_clauses" | "saving_findings" }`
        - `finding` - one RiskFinding object per event, sent after the analysis completes (the LLM returns findings as one JSON block, so they are not generated incrementally)
        - `done` `{ "total": number }`
        - `error` `{ "status": number, "message": string }` - the HTTP status is already 200 once streaming starts, so failures (including 404/400 such as "clauses not segmented yet") arrive as this event
        A `: ping` comment line is sent every 15s to keep proxies from closing an idle connection - SSE clients must ignore lines starting with `:`. Closing the connection before the analysis finishes cancels the LLM call and marks riskDetectionStatus as "failed"; once the LLM has answered, the findings are saved even if the client is gone.
        Rate-limited (AI cost control).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                analysisFocus:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string

  /contracts/{id}/chat:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    get:
      tags: [Contracts]
      summary: List the chat history for the contract's current version, oldest first
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Contracts]
      summary: Ask a follow-up question about the contract
      description: Requires clauses to be segmented. The answer is grounded in the contract's clauses, summary, risk findings and analysisFocus, plus the last 10 chat messages. Both the question and the answer are saved. Rate-limited (AI cost control).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 5000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string
        '400':
          description: Clauses not segmented yet, or LLM not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}/chat/stream:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    post:
      tags: [Contracts]
      summary: Same as POST /chat, but the answer is streamed token by token as Server-Sent Events
      description: |
        Use `fetch` (not `EventSource`). Events:
        - `token` `{ "text": string }` - next chunk of the answer
        - `done` `{}` - the full exchange has been saved (nothing is saved if the stream fails or is aborted)
        - `error` `{ "status": number, "message": string }`
        A `: ping` comment line is sent every 15s to keep proxies from closing an idle connection - SSE clients must ignore lines starting with `:`. Closing the connection cancels the LLM call; if the answer had already finished generating, it is still saved.
        Rate-limited (AI cost control).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 5000
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string

  /contracts/{id}/reviews:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    post:
      tags: [Reviews]
      summary: Start a full review in the background
      description: Queues segmentation, summary and risk detection as one review run and returns 202 immediately. Follow it with GET /reviews/{reviewId}/events (SSE) or by polling GET /reviews/{reviewId}. If the upload is still being extracted, the review waits for it. Only one review can run per contract at a time. Rate-limited (AI cost control).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                analysisFocus:
                  type: string
                  maxLength: 1000
      responses:
        '202':
          description: Review queued
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/reviews/665f1c2e8b3a4d0012a1b2c3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: The contract has no file, or its text could not be extracted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: A review is already running for this contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The background job queue (Redis) is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Reviews]
      summary: List the review runs of a contract, newest first
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Review'
        '404':
          description: Contract not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reviews/{reviewId}:
    parameters:
      - in: path
        name: reviewId
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    get:
      tags: [Reviews]
      summary: Get one review run
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reviews/{reviewId}/events:
    parameters:
      - in: path
        name: reviewId
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    get:
      tags: [Reviews]
      summary: Follow a review's progress as Server-Sent Events
      description: |
        `text/event-stream`. Works with `EventSource` when the access token is sent by a proxy, or with `fetch`. Events:
        - `review` - the full Review object, sent on connect and whenever it changes
        - `done` `{ "status": "completed" | "failed" }` - sent once the review finishes, then the stream closes
        - `error` `{ "status": number, "message": string }`
        A `: ping` comment is sent every 15s. Reconnecting is safe - the current state is sent again on connect.
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contract-profiles:
    get:
      tags: [ContractProfiles]
      summary: List the supported contract types with their parties, governing law, mandatory clauses and industry rules
      description: Use a profile's code as Contract.type, one of its parties' codes as ourParty, and one of its industries' codes as industry when uploading a contract.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContractProfile'

  /kb/legal-sources:
    get:
      tags: [LegalKB]
      summary: List legal sources in the knowledge base (with chunk counts)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LegalSource'
    post:
      tags: [LegalKB]
      summary: Upload a legal document (pdf/docx/txt), chunk it by "Dieu N" headings, and embed each chunk (Gemini)
      description: Admin only. Rate-limited (AI cost control). Each "Điều N" becomes one chunk; an article longer than 3000 characters is split at the nearest paragraph/line/sentence/word boundary, and consecutive pieces overlap by ~300 characters. Chunks are embedded in batches of up to 100 (task type RETRIEVAL_DOCUMENT). All chunks are embedded before anything is saved, and a failed save removes the partial source, so a failed upload never leaves a half-ingested source behind.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateLegalSourceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalSource'
        '400':
          description: Validation error, unsupported file type, or LLM not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: File exceeds the 20MB limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Requires administrator role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /kb/legal-sources/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    delete:
      tags: [LegalKB]
      summary: Delete a legal source and all of its chunks
      description: Admin only.
      responses:
        '204':
          description: Deleted
        '403':
          description: Requires administrator role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
