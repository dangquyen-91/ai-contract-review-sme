            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Contracts]
      summary: Delete a contract
      description: Deletes the contract, all its versions, clauses, findings, chat messages and stored files. Roles - administrator, owner, manager, and user (the owner of a personal workspace).
      responses:
        '204':
          description: No Content
        '403':
          description: Role not allowed to delete contracts (staff, reviewer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}/clauses:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    get:
      tags: [Contracts]
      summary: List clauses segmented/classified for a contract
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Clause'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}/clauses/segment:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    post:
      tags: [Contracts]
      summary: Run clause segmentation/classification/summarization for a contract via LLM (Gemini)
      description: Requires the contract's text to already be extracted (extractionStatus = completed). Replaces any previously segmented clauses and, on success, discards the previous analysis - risk findings/citations are deleted, summaryPoints/overallAssessment are cleared, summaryStatus/riskDetectionStatus go back to "pending" and overallRiskLevel to "none". If the LLM call fails, the previous clauses and analysis are kept. Splitting - when the text has at least 3 sequentially numbered "Điều N" headings at line starts, the server splits on them (any text before "Điều 1" becomes the first clause) and the LLM only classifies and summarizes each part; otherwise the LLM returns the first words of each clause and the server cuts the text at those points. Either way each clause's text is an exact slice of the extracted text and startOffset/endOffset always match it. Each clause is also given a short plain-language Vietnamese summary. Rate-limited (AI cost control).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Clause'
        '400':
          description: Contract text not extracted yet, or LLM not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Segmentation, summary or risk detection is already running for this contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}/summary:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    post:
      tags: [Contracts]
      summary: Generate a plain-language Vietnamese summary of the whole contract via LLM (Gemini)
      description: Requires clauses to already be segmented (segmentationStatus = completed). Synthesizes per-clause summaries into one overview and stores it on the contract. Rate-limited (AI cost control).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                analysisFocus:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  description: Optional analysis direction; the summary emphasizes the parts relevant to it. Stored on the contract version.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '400':
          description: Clauses not segmented yet, or LLM not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Summary is already running, or clauses are being re-segmented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}/risks:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    get:
      tags: [Contracts]
      summary: List risk findings detected for a contract
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RiskFinding'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}/risks/detect:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    post:
      tags: [Contracts]
      summary: Run hybrid (rule-based + LLM) risk detection for a contract, grounded with RAG citations
      description: Requires clauses to already be segmented (segmentationStatus = completed). Produces two kinds of findings - "clause_risk" (detectedBy=llm, Gemini reviews each clause, retrieving relevant legal excerpts per clause via vector search and citing the ones it relied on) and "missing_clause" (a rule determines which mandatory clause types - per the contract profile's mandatoryClauses plus the extra mandatory clauses of the contract's industry - are absent, then Gemini explains each and drafts a clause to add; detectedBy=hybrid, or rule if Gemini skipped it). Each finding has problem / consequences / legalBasis / recommendations / proposedRevision. Also sets the version overallAssessment and overallRiskLevel. The new findings replace the previous ones only once saved successfully. Returns 409 if a run is already in progress for the contract (a run stuck over 10 minutes is considered stale). Rate-limited (AI cost control).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                analysisFocus:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  description: Optional analysis direction (e.g. "phân tích theo hướng có lợi cho bên A"); the LLM judges risk accordingly. Stored on the contract version and reused when not re-sent.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RiskFinding'
        '400':
          description: Clauses not segmented yet, or LLM not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Risk detection is already running, or clauses are being re-segmented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}/risks/{findingId}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
      - in: path
        name: findingId
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    patch:
      tags: [Contracts]
      summary: Edit the proposed revision of a finding
      description: Updates proposedRevision.revisedText and/or reason and marks it isEdited=true. Only findings of the contract's current version can be edited; 404 if the finding has no proposed revision. Roles - administrator, owner, manager, staff, reviewer, user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                revisedText:
                  type: string
                  minLength: 1
                  maxLength: 10000
                reason:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '200':
          description: The updated finding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskFinding'
        '404':
          description: Contract, finding or proposed revision not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}/risks/{findingId}/revision:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
      - in: path
        name: findingId
        required: true
