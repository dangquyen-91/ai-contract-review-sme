openapi: 3.0.0
info:
  title: AI Contract Review Assistant API
  version: 0.1.0
  description: REST API for the FPT Capstone AI Contract Review Assistant
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Contracts
  - name: LegalKB

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        details:
          type: object

    RegisterRequest:
      type: object
      required: [orgName, name, email, password]
      properties:
        orgName:
          type: string
          minLength: 2
          maxLength: 200
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    Contract:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [sales, service, labor, saas]
          description: "Contract type: sales (mua bán hàng hóa), service (cung ứng dịch vụ), labor (lao động), saas (thuê phần mềm/công nghệ)"
        status:
          type: string
        currentVersion:
          $ref: '#/components/schemas/ContractVersion'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ContractVersion:
      type: object
      description: All per-upload state for a contract (currently only version 1 is ever created - no re-upload/version-compare UI yet).
      properties:
        id:
          type: string
        contractId:
          type: string
        versionNumber:
          type: integer
        fileUrl:
          type: string
          description: Cloudinary secure URL of the uploaded contract file
        fileName:
          type: string
        mimeType:
          type: string
        extractionStatus:
          type: string
          enum: [pending, processing, completed, failed, unsupported]
          description: Status of text extraction (OCR/parsing) from the uploaded file
        extractionError:
          type: string
          description: Error message when extractionStatus is "failed"
        segmentationStatus:
          type: string
          enum: [pending, processing, completed, failed]
          description: Status of clause segmentation/classification (see /contracts/{id}/clauses)
        segmentationError:
          type: string
          description: Error message when segmentationStatus is "failed"
        riskDetectionStatus:
          type: string
          enum: [pending, processing, completed, failed]
          description: Status of risk detection (see /contracts/{id}/risks)
        riskDetectionError:
          type: string
          description: Error message when riskDetectionStatus is "failed"
        overallRiskLevel:
          type: string
          enum: [high, medium, low, none]
        analysisFocus:
          type: string
          description: Free-text analysis direction the user last requested (e.g. "phân tích theo hướng có lợi cho bên A"), sent to /risks/detect or /summary. Reused by later calls and by chat when not re-sent.
        summary:
          type: string
          description: Plain-language Vietnamese overview of the whole contract, generated by the LLM (see /contracts/{id}/summary)
        summaryStatus:
          type: string
          enum: [pending, processing, completed, failed]
          description: Status of whole-contract summarization
        summaryError:
          type: string
          description: Error message when summaryStatus is "failed"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ClauseTypeTaxonomy:
      type: object
      description: A clause category in the shared taxonomy, seeded on server boot
      properties:
        id:
          type: string
        code:
          type: string
          enum:
            [
              payment,
              confidentiality,
              termination,
              penalty,
              indemnity,
              intellectual_property,
              dispute_resolution,
              liability,
              force_majeure,
              renewal,
              warranty,
              other,
            ]
        name:
          type: string
        description:
          type: string
        applicableContractTypes:
          type: array
          items:
            type: string
            enum: [sales, service, labor, saas]
        isMandatory:
          type: boolean
          description: If true and applicable to a contract's type, a missing clause of this type is flagged as a rule-based "missing_clause" finding

    Clause:
      type: object
      properties:
        id:
          type: string
        contractVersionId:
          type: string
        index:
          type: integer
          description: Order of the clause within the contract
        title:
          type: string
          description: 'Clause heading, if present in the contract (e.g. "Dieu 3: Thanh toan")'
        text:
          type: string
          description: Verbatim clause text extracted from the contract
        startOffset:
          type: integer
          description: Start position (inclusive) of this clause in the extracted text returned by GET /contracts/{id}/text. Absent if the clause could not be located (or was segmented before this field existed - re-run segmentation).
        endOffset:
          type: integer
          description: End position (exclusive) of this clause in the extracted text
        clauseTypeId:
          $ref: '#/components/schemas/ClauseTypeTaxonomy'
          description: Populated taxonomy entry for this clause's category
        summary:
          type: string
          description: Short plain-language explanation of the clause, in Vietnamese, generated by the LLM
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ChatMessage:
      type: object
      properties:
        id:
          type: string
        contractVersionId:
          type: string
        userId:
          type: string
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    RiskFinding:
      type: object
      properties:
        id:
          type: string
        contractVersionId:
          type: string
        clauseId:
          type: string
          nullable: true
          description: Set when findingType is "clause_risk"; null for "missing_clause"
        clause:
          type: object
          nullable: true
          description: Position info of the clause this finding refers to (for highlighting in the document view); null for "missing_clause"
          properties:
            index:
              type: integer
            title:
              type: string
            startOffset:
              type: integer
              description: Offset into the text from GET /contracts/{id}/text; absent if the clause could not be located
            endOffset:
              type: integer
        expectedClauseTypeId:
          $ref: '#/components/schemas/ClauseTypeTaxonomy'
          description: Set when findingType is "missing_clause"; the populated taxonomy entry expected but absent
        findingType:
          type: string
          enum: [clause_risk, missing_clause]
        severity:
          type: string
          enum: [high, medium, low]
        title:
          type: string
        explanation:
          type: string
          description: Plain-language Vietnamese explanation of the risk
        suggestedRevision:
          type: string
        status:
          type: string
          enum: [open, acknowledged, dismissed, resolved]
        detectedBy:
          type: string
          enum: [rule, llm, hybrid]
        citations:
          type: array
          description: Legal sources the LLM actually relied on for this finding (RAG), populated by GET/POST risk endpoints
          items:
            $ref: '#/components/schemas/RiskCitation'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RiskCitation:
      type: object
      properties:
        legalKnowledgeChunkId:
          type: string
        citationLabel:
          type: string
          description: 'e.g. "BLDS 2015"'
        sourceTitle:
          type: string
        articleRef:
          type: string
          description: 'e.g. "Dieu 418, Khoan 2"'
        chunkText:
          type: string
        relevanceScore:
          type: number
          description: Cosine similarity score from the vector search retrieval (0-1)

    CreateContractRequest:
      type: object
      required: [title, type]
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 300
        type:
          type: string
          enum: [sales, service, labor, saas]
        file:
          type: string
          format: binary

    LegalSource:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          description: 'e.g. "Bo luat Dan su 2015"'
        sourceType:
          type: string
          enum: [law, standard_template]
        citationLabel:
          type: string
          description: 'Short label used when citing this source, e.g. "BLDS 2015"'
        issuingBody:
          type: string
        effectiveDate:
          type: string
          format: date-time
        chunkCount:
          type: integer
          description: Number of LegalKnowledgeChunk documents produced from this source (list endpoint only)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateLegalSourceRequest:
      type: object
      required: [title, sourceType, citationLabel, file]
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 300
        sourceType:
          type: string
          enum: [law, standard_template]
        citationLabel:
          type: string
          minLength: 1
          maxLength: 100
        issuingBody:
          type: string
          maxLength: 200
        effectiveDate:
          type: string
          format: date
        file:
          type: string
          format: binary
          description: Legal document to chunk and embed (pdf, docx, or txt)

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new organization and its first admin user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts:
    get:
      tags: [Contracts]
      summary: List contracts for the current org (filter/sort/paginate)
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: sortBy
          schema: { type: string }
        - in: query
          name: sortOrder
          schema: { type: string, enum: [asc, desc] }
        - in: query
          name: type
          schema: { type: string, enum: [sales, service, labor, saas] }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: riskLevel
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contract'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
    post:
      tags: [Contracts]
      summary: Upload a new contract
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateContractRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    get:
      tags: [Contracts]
      summary: Get a contract by id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Contracts]
      summary: Delete a contract
      responses:
        '204':
          description: No Content
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}/clauses:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    get:
      tags: [Contracts]
      summary: List clauses segmented/classified for a contract
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Clause'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}/clauses/segment:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    post:
      tags: [Contracts]
      summary: Run clause segmentation/classification/summarization for a contract via LLM (Gemini)
      description: Requires the contract's text to already be extracted (extractionStatus = completed). Replaces any previously segmented clauses. Each clause is also given a short plain-language Vietnamese summary. Rate-limited (AI cost control).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Clause'
        '400':
          description: Contract text not extracted yet, or LLM not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}/summary:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    post:
      tags: [Contracts]
      summary: Generate a plain-language Vietnamese summary of the whole contract via LLM (Gemini)
      description: Requires clauses to already be segmented (segmentationStatus = completed). Synthesizes per-clause summaries into one overview and stores it on the contract. Rate-limited (AI cost control).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                analysisFocus:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  description: Optional analysis direction; the summary emphasizes the parts relevant to it. Stored on the contract version.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '400':
          description: Clauses not segmented yet, or LLM not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}/risks:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    get:
      tags: [Contracts]
      summary: List risk findings detected for a contract
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RiskFinding'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}/risks/detect:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    post:
      tags: [Contracts]
      summary: Run hybrid (rule-based + LLM) risk detection for a contract, grounded with RAG citations
      description: Requires clauses to already be segmented (segmentationStatus = completed). Produces two kinds of findings - "clause_risk" (detectedBy=llm, Gemini reviews each clause, retrieving relevant legal excerpts per clause via vector search and citing the ones it actually relied on) and "missing_clause" (detectedBy=rule, a deterministic check for mandatory clause types - per ClauseTypeTaxonomy.isMandatory/applicableContractTypes - that aren't present). Replaces any previously detected findings and recomputes the contract version's overallRiskLevel. Rate-limited (AI cost control).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                analysisFocus:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  description: Optional analysis direction (e.g. "phân tích theo hướng có lợi cho bên A"); the LLM judges risk accordingly. Stored on the contract version and reused when not re-sent.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RiskFinding'
        '400':
          description: Clauses not segmented yet, or LLM not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}/text:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    get:
      tags: [Contracts]
      summary: Get the extracted text of the contract (for the document view next to the analysis)
      description: Clause.startOffset/endOffset and RiskFinding.clause.startOffset/endOffset index into this text, so the UI can highlight the clause a finding refers to.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  text:
                    type: string
                  extractionStatus:
                    type: string
                    enum: [pending, processing, completed, failed, unsupported]
                  fileUrl:
                    type: string
                  fileName:
                    type: string
                  mimeType:
                    type: string
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}/risks/detect/stream:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    post:
      tags: [Contracts]
      summary: Same as /risks/detect, but streamed as Server-Sent Events
      description: |
        Same behavior and body as POST /contracts/{id}/risks/detect, delivered as `text/event-stream`. Use `fetch` (not `EventSource`, which cannot POST or send an Authorization header). Events:
        - `progress` `{ "stage": "retrieving_legal_sources" | "analyzing_clauses" | "saving_findings" }`
        - `finding` - one RiskFinding object per event, sent after the analysis completes (the LLM returns findings as one JSON block, so they are not generated incrementally)
        - `done` `{ "total": number }`
        - `error` `{ "status": number, "message": string }` - the HTTP status is already 200 once streaming starts, so failures (including 404/400 such as "clauses not segmented yet") arrive as this event
        Rate-limited (AI cost control).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                analysisFocus:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string

  /contracts/{id}/chat:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    get:
      tags: [Contracts]
      summary: List the chat history for the contract's current version, oldest first
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Contracts]
      summary: Ask a follow-up question about the contract
      description: Requires clauses to be segmented. The answer is grounded in the contract's clauses, summary, risk findings and analysisFocus, plus the last 10 chat messages. Both the question and the answer are saved. Rate-limited (AI cost control).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 5000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string
        '400':
          description: Clauses not segmented yet, or LLM not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}/chat/stream:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    post:
      tags: [Contracts]
      summary: Same as POST /chat, but the answer is streamed token by token as Server-Sent Events
      description: |
        Use `fetch` (not `EventSource`). Events:
        - `token` `{ "text": string }` - next chunk of the answer
        - `done` `{}` - the full exchange has been saved (nothing is saved if the stream fails or is aborted)
        - `error` `{ "status": number, "message": string }`
        Rate-limited (AI cost control).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 5000
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string

  /kb/legal-sources:
    get:
      tags: [LegalKB]
      summary: List legal sources in the knowledge base (with chunk counts)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LegalSource'
    post:
      tags: [LegalKB]
      summary: Upload a legal document (pdf/docx/txt), chunk it by "Dieu N" headings, and embed each chunk (Gemini)
      description: Admin only. Rate-limited (AI cost control). Each chunk is embedded individually, so a large document (e.g. a full law) can take a while.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateLegalSourceRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalSource'
        '400':
          description: Validation error, unsupported file type, or LLM not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Requires administrator role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /kb/legal-sources/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    delete:
      tags: [LegalKB]
      summary: Delete a legal source and all of its chunks
      description: Admin only.
      responses:
        '204':
          description: Deleted
        '403':
          description: Requires administrator role
          content:
            application/json:
              schema:
