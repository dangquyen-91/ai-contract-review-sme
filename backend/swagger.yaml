openapi: 3.0.0
info:
  title: AI Contract Review Assistant API
  version: 0.1.0
  description: REST API for the FPT Capstone AI Contract Review Assistant
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Contracts

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        details:
          type: object

    RegisterRequest:
      type: object
      required: [orgName, name, email, password]
      properties:
        orgName:
          type: string
          minLength: 2
          maxLength: 200
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    Contract:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [sales, service, labor, saas]
          description: "Contract type: sales (mua bán hàng hóa), service (cung ứng dịch vụ), labor (lao động), saas (thuê phần mềm/công nghệ)"
        status:
          type: string
        riskLevel:
          type: string
        fileUrl:
          type: string
          description: Cloudinary secure URL of the uploaded contract file
        fileName:
          type: string
        mimeType:
          type: string
        extractionStatus:
          type: string
          enum: [pending, processing, completed, failed, unsupported]
          description: Status of text extraction (OCR/parsing) from the uploaded file
        extractionError:
          type: string
          description: Error message when extractionStatus is "failed"
        segmentationStatus:
          type: string
          enum: [pending, processing, completed, failed]
          description: Status of clause segmentation/classification (see /contracts/{id}/clauses)
        segmentationError:
          type: string
          description: Error message when segmentationStatus is "failed"
        riskDetectionStatus:
          type: string
          enum: [pending, processing, completed, failed]
          description: Status of risk detection (see /contracts/{id}/risks)
        riskDetectionError:
          type: string
          description: Error message when riskDetectionStatus is "failed"
        summary:
          type: string
          description: Plain-language Vietnamese overview of the whole contract, generated by the LLM (see /contracts/{id}/summary)
        summaryStatus:
          type: string
          enum: [pending, processing, completed, failed]
          description: Status of whole-contract summarization
        summaryError:
          type: string
          description: Error message when summaryStatus is "failed"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Clause:
      type: object
      properties:
        id:
          type: string
        contractId:
          type: string
        index:
          type: integer
          description: Order of the clause within the contract
        title:
          type: string
          description: 'Clause heading, if present in the contract (e.g. "Dieu 3: Thanh toan")'
        text:
          type: string
          description: Verbatim clause text extracted from the contract
        category:
          type: string
          enum:
            [
              payment,
              confidentiality,
              termination,
              penalty,
              indemnity,
              intellectual_property,
              dispute_resolution,
              liability,
              force_majeure,
              renewal,
              warranty,
              other,
            ]
        summary:
          type: string
          description: Short plain-language explanation of the clause, in Vietnamese, generated by the LLM
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RiskFinding:
      type: object
      properties:
        id:
          type: string
        contractId:
          type: string
        clauseId:
          type: string
          nullable: true
          description: Set when findingType is "clause_risk"; null for "missing_clause"
        expectedClauseCategory:
          type: string
          nullable: true
          description: Set when findingType is "missing_clause"; the clause category expected but absent
        findingType:
          type: string
          enum: [clause_risk, missing_clause]
        severity:
          type: string
          enum: [high, medium, low]
        title:
          type: string
        explanation:
          type: string
          description: Plain-language Vietnamese explanation of the risk
        suggestedRevision:
          type: string
        status:
          type: string
          enum: [open, acknowledged, dismissed, resolved]
        detectedBy:
          type: string
          enum: [rule, llm, hybrid]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateContractRequest:
      type: object
      required: [title, type]
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 300
        type:
          type: string
          enum: [sales, service, labor, saas]
        file:
          type: string
          format: binary

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new organization and its first admin user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts:
    get:
      tags: [Contracts]
      summary: List contracts for the current org (filter/sort/paginate)
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: sortBy
          schema: { type: string }
        - in: query
          name: sortOrder
          schema: { type: string, enum: [asc, desc] }
        - in: query
          name: type
          schema: { type: string, enum: [sales, service, labor, saas] }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: riskLevel
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contract'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
    post:
      tags: [Contracts]
      summary: Upload a new contract
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateContractRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    get:
      tags: [Contracts]
      summary: Get a contract by id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Contracts]
      summary: Delete a contract
      responses:
        '204':
          description: No Content
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}/clauses:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    get:
      tags: [Contracts]
      summary: List clauses segmented/classified for a contract
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Clause'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}/clauses/segment:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    post:
      tags: [Contracts]
      summary: Run clause segmentation/classification/summarization for a contract via LLM (Gemini)
      description: Requires the contract's text to already be extracted (extractionStatus = completed). Replaces any previously segmented clauses. Each clause is also given a short plain-language Vietnamese summary. Rate-limited (AI cost control).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Clause'
        '400':
          description: Contract text not extracted yet, or LLM not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}/summary:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    post:
      tags: [Contracts]
      summary: Generate a plain-language Vietnamese summary of the whole contract via LLM (Gemini)
      description: Requires clauses to already be segmented (segmentationStatus = completed). Synthesizes per-clause summaries into one overview and stores it on the contract. Rate-limited (AI cost control).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '400':
          description: Clauses not segmented yet, or LLM not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}/risks:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    get:
      tags: [Contracts]
      summary: List risk findings detected for a contract
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RiskFinding'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /contracts/{id}/risks/detect:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          pattern: '^[a-f\d]{24}$'
    post:
      tags: [Contracts]
      summary: Run risk detection for a contract via LLM (Gemini)
      description: Requires clauses to already be segmented (segmentationStatus = completed). Replaces any previously detected findings and recomputes the contract's overallRiskLevel. Rate-limited (AI cost control).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RiskFinding'
        '400':
          description: Clauses not segmented yet, or LLM not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
