services:
  mongo:
    image: mongo:7
    container_name: acr-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    # Note: local mongod does NOT support Atlas Vector Search ($vectorSearch).
    # Use this only for non-AI CRUD development; point MONGODB_URI at a real
    # Atlas cluster when working on embeddings/semantic search.

  minio:
    image: minio/minio:latest
    container_name: acr-minio
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

volumes:
  mongo-data:
  minio-data:
